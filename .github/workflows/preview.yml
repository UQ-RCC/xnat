name: Preview

# Builds every site under demo/sites/ for a pull request and deploys each to
# its own Cloudflare Pages project (uq-rcc-<site>). Each preview is served at
# the root of its own hostname, so root-relative links need no base path.
# Production stays on GitHub Pages; this workflow never deploys main.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sites:
    # Fork PRs get no secrets, so they cannot deploy a preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: list
        run: |
          list=$(find demo/sites -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastUpdated reads commit dates

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        working-directory: demo/sites/${{ matrix.site }}
        run: npx astro build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy demo/sites/${{ matrix.site }}/dist
            --project-name=uq-rcc-${{ matrix.site }}
            --branch=pr-${{ github.event.pull_request.number }}

  comment:
    needs: [sites, deploy]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post preview links
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SITES: ${{ needs.sites.outputs.list }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const marker = '<!-- preview-links -->';
            const sha = pr.head.sha.substring(0, 7);
            // --branch=pr-N gives each project a stable alias for this PR.
            const rows = JSON.parse(process.env.SITES).map(
              (site) => `| ${site} | https://pr-${pr.number}.uq-rcc-${site}.pages.dev |`,
            );
            const body = [
              marker,
              `**Previews** for \`${sha}\``,
              '',
              '| Site | URL |',
              '| --- | --- |',
              ...rows,
            ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
